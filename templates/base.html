{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block title %}{{ profile.name }} · AI &amp; Web Developer{% endblock %}</title>
  <meta name="description" content="{{ profile.name }} — {{ profile.subtitle }}.">
  <meta name="author" content="{{ profile.name }}">
  <meta name="theme-color" content="#050510">
  <link rel="canonical" href="{{ site_url }}/">
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
  <link rel="apple-touch-icon" href="{% static 'img/Image.png' %}">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ profile.name }} · Portfolio">
  <meta property="og:title" content="{{ profile.name }} · AI &amp; Web Developer">
  <meta property="og:description" content="{{ profile.subtitle }}.">
  <meta property="og:url" content="{{ site_url }}/">
  <meta property="og:image" content="{{ site_url }}{% static 'img/og-image.png' %}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ profile.name }} · AI &amp; Web Developer">
  <meta name="twitter:description" content="{{ profile.subtitle }}.">
  <meta name="twitter:image" content="{{ site_url }}{% static 'img/og-image.png' %}">

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('portfolio-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (error) {}
    })();
  </script>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ profile.name|escapejs }}",
    "url": "{{ site_url }}/",
    "image": "{{ site_url }}{% static 'img/Image.png' %}",
    "jobTitle": "{{ profile.job_title|escapejs }}",
    "alumniOf": { "@type": "CollegeOrUniversity", "name": "{{ profile.university|escapejs }}" },
    "knowsAbout": [{% for topic in profile.knows_about_list %}"{{ topic|escapejs }}"{% if not forloop.last %}, {% endif %}{% endfor %}],
    "sameAs": [{% for url in profile.social_urls %}"{{ url|escapejs }}"{% if not forloop.last %}, {% endif %}{% endfor %}]
  }
  </script>
</head>
<body>
  <div id="gradient-bg"></div>
  <div class="overlay"></div>

  <!-- HEADER -->
  <header>
    <div class="nav-container">
      <div class="logo">{{ profile.logo_text }}</div>
      <nav class="desktop-nav">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light mode" aria-pressed="false">
          <i class="fas fa-moon"></i>
        </button>
        <button class="mobile-menu-btn" id="menuToggle" aria-label="Open menu">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </div>
  </header>

  {% block content %}{% endblock %}

  <!-- FOOTER -->
  <footer>
    <p>Made with <span class="heart"><i class="fas fa-heart"></i></span> by {{ profile.name }} · {% now "Y" %}</p>
  </footer>

  <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
